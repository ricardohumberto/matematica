<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Tablas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body{
    font-family:'Fredoka',Arial,sans-serif;
    background:#f3f7ff;

    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
    box-sizing:border-box;
}

    .card {
      background: white;
      max-width: 480px;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px #ccc;
    }

  .operacion{

    width:100%;

    text-align:center;

    font-size:46px;

    font-weight:bold;

    margin:18px 0;

}

   .opciones{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:15px 0;
}

.opciones button{
    width:100%;
    padding:12px;
    font-size:22px;
    border-radius:12px;
    border:2px solid #aaa;
    cursor:pointer;
    background:#f8f8f8;
}

    .opciones button:hover {
      background: #e8f0ff;
    }

    .correcta {
      background: #b8f7b8 !important;
      border-color: green !important;
    }

    .incorrecta {
      background: #ffb8b8 !important;
      border-color: red !important;
    }

    #mensaje {
      font-size: 24px;
      font-weight: bold;
      min-height: 35px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px 0px;
      text-align: center;
    }

    .resultado {
      font-size: 22px;
      line-height: 1.6;
      text-align: left;
      margin-top: 20px;
    }

    .resultado h2 {
      text-align: center;
    }

    .resultado ul {
      list-style: none;
      padding: 0;
    }

    .resultado li {
      background: #f3f7ff;
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
    }

    #tiempo{

    width:100%;

    text-align:center;

    font-size:30px;

    font-weight:bold;

    margin:10px 0;

    color:#0066cc;

}

    #contenedorBarra{

    width:100%;

    height:22px;

    background:#ddd;

    border-radius:12px;

    overflow:hidden;

    margin:12px 0 18px 0;

}

    #barraTiempo{
      width:100%;
      height:100%;
      background:limegreen;
      transition:width 1s linear, background .5s;
    }

    .peligro{
      color:red !important;
    }

    .urgente{
      animation:pulsar .5s infinite alternate;
    }

    @keyframes pulsar{
      from{ transform:scaleY(1); }
      to{ transform:scaleY(1.15); }
    }

    .titulo{
      animation:rebote 1.5s infinite;
      margin-top:5px;
      margin-bottom:12px;
      font-size:26px;
      font-weight:bold;
      background:linear-gradient(
        90deg,
        #ff4d4d,
        #ff9800,
        #ffd600,
        #4caf50,
        #2196f3,
        #673ab7
      );
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:2px 2px 8px rgba(0,0,0,.15);
      letter-spacing:2px;
    }

    @keyframes rebote{
      0%{ transform:translateY(0px); }
      50%{ transform:translateY(-6px); }
      100%{ transform:translateY(0px); }
    }

    .pantallaMenu{
    position:fixed;
    inset:0;
    background:#f3f7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.menu{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    width:420px;
}

.menu h2{
    margin-top:0;
}

.menu label{
    display:block;
    font-size:22px;
    margin:12px 0;
    cursor:pointer;
}

.menu input[type=checkbox]{
    transform:scale(1.5);
    margin-right:10px;
}
p{

    text-align:center;

}
.botones{

    text-align:center;

    margin-top:20px;

}
  </style>
</head>

<body>

  <div class="pantallaMenu" id="pantallaMenu">

<div class="menu">

<h2>📚 Escoge las tablas</h2>

<label><input type="checkbox" id="todas"> 🌈 Todas las tablas</label>

<hr>

<label><input type="checkbox" class="tabla" value="2"> Tabla del 2</label>

<label><input type="checkbox" class="tabla" value="3"> Tabla del 3</label>

<label><input type="checkbox" class="tabla" value="4"> Tabla del 4</label>

<label><input type="checkbox" class="tabla" value="5"> Tabla del 5</label>

<label><input type="checkbox" class="tabla" value="6"> Tabla del 6</label>

<label><input type="checkbox" class="tabla" value="7"> Tabla del 7</label>

<label><input type="checkbox" class="tabla" value="8"> Tabla del 8</label>

<label><input type="checkbox" class="tabla" value="9"> Tabla del 9</label>

<br>

<button onclick="iniciarJuego()">
🚀 Comenzar
</button>

</div>

</div>

  <div class="card">
    <h1 class="titulo">Tablas de Multiplicar para Valentina Chon ❤️</h1>

    <p>Pregunta <span id="actual">1</span> de <span id="total">10</span></p>

    <div id="contenedorBarra">
      <div id="barraTiempo"></div>
    </div>

    <div id="tiempo">⏳ 10 s</div>

    <div class="operacion" id="operacion"></div>

    <div class="opciones" id="opciones"></div>

    <p id="mensaje"></p>
<div class="botones">
    <button class="btn" id="btnSiguiente" onclick="siguiente()" style="display:none;">
      Siguiente
    </button>

    <button class="btn" id="btnReiniciar" onclick="reiniciar()" style="display:none;">
      Reiniciar
    </button>
    </div>
  </div>

  <script>
    const totalPreguntas = 10;
    const tiempoLimite = 10;

    let preguntaActual = 1;
    let correctas = 0;
    let numero1 = 0;
    let numero2 = 0;
    let respuestaCorrecta = 0;
    let yaRespondio = false;
    let tiempo = tiempoLimite;
    let temporizador = null;

    let historial = [];

    let tablasSeleccionadas=[];

    document.getElementById("total").textContent = totalPreguntas;

    function generarNumero(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function mezclar(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generarOpciones(correcta) {
      let opciones = [correcta];

      while (opciones.length < 6) {
        let falsa = correcta + generarNumero(-20, 20);

        if (falsa < 0) falsa = generarNumero(1, 100);

        if (!opciones.includes(falsa) && falsa !== correcta) {
          opciones.push(falsa);
        }
      }

      return mezclar(opciones);
    }

    function nuevaPregunta() {
      yaRespondio = false;

      numero1 =
tablasSeleccionadas[
    generarNumero(0,tablasSeleccionadas.length-1)
];

numero2 = generarNumero(2,9);

      respuestaCorrecta = numero1 * numero2;

      historial.push({
        numero1: numero1,
        numero2: numero2,
        respuesta: respuestaCorrecta
      });

      document.getElementById("actual").textContent = preguntaActual;
      document.getElementById("operacion").textContent = numero1 + " × " + numero2;
      document.getElementById("mensaje").textContent = "";
      document.getElementById("btnSiguiente").style.display = "none";

      const opcionesDiv = document.getElementById("opciones");
      opcionesDiv.innerHTML = "";

      const opciones = generarOpciones(respuestaCorrecta);

      opciones.forEach(opcion => {
        const boton = document.createElement("button");
        boton.textContent = opcion;
        boton.onclick = function() {
          responder(boton, opcion);
        };
        opcionesDiv.appendChild(boton);
      });

      iniciarTemporizador();
    }

    function responder(botonSeleccionado, valor) {
      if (yaRespondio) return;

      clearInterval(temporizador);
      yaRespondio = true;

      const botones = document.querySelectorAll("#opciones button");

      botones.forEach(boton => {
        boton.disabled = true;

        if (Number(boton.textContent) === respuestaCorrecta) {
          boton.classList.add("correcta");
        }
      });

      if (valor === respuestaCorrecta) {
        correctas++;
        document.getElementById("mensaje").textContent = "✅ Correcto";
      } else {
        botonSeleccionado.classList.add("incorrecta");
        document.getElementById("mensaje").textContent =
          "❌ Incorrecto. La respuesta era " + respuestaCorrecta;
      }

      if (preguntaActual < totalPreguntas) {
        document.getElementById("btnSiguiente").style.display = "inline-block";
      } else {
        document.getElementById("btnReiniciar").style.display = "inline-block";
        mostrarResultadoFinal();
      }
    }

    function siguiente() {
      preguntaActual++;
      nuevaPregunta();
    }

    function mostrarResultadoFinal() {
      clearInterval(temporizador);

      document.getElementById("btnSiguiente").style.display = "none";
      document.getElementById("operacion").textContent = "🎉 Fin de la prueba";
      document.getElementById("opciones").innerHTML = "";
      document.getElementById("contenedorBarra").style.display = "none";
      document.getElementById("tiempo").style.display = "none";

      let listado = "";

      /*historial.forEach((item, index) => {
        listado += `
          <li>
            ${index + 1}. ${item.numero1} × ${item.numero2} = <strong>${item.respuesta}</strong>
          </li>
        `;
      });*/
      historial.forEach((item, index) => {
        listado += `
          <li>
            ${item.numero1} × ${item.numero2} = <strong>${item.respuesta}</strong>
          </li>
        `;
      });

      document.getElementById("mensaje").innerHTML = `
        <div class="resultado">
          <h2>📋 Multiplicaciones de la prueba</h2>
          <ul>
            ${listado}
          </ul>
        </div>
      `;
    }

    function reiniciar() {
      clearInterval(temporizador);

      preguntaActual = 1;
      correctas = 0;
      historial = [];

      document.getElementById("btnReiniciar").style.display = "none";
      document.getElementById("contenedorBarra").style.display = "block";
      document.getElementById("tiempo").style.display = "block";

      nuevaPregunta();
    }

    function iniciarTemporizador() {
      clearInterval(temporizador);

      tiempo = tiempoLimite;

      const lbl = document.getElementById("tiempo");
      const barra = document.getElementById("barraTiempo");

      barra.style.width = "100%";
      barra.style.background = "limegreen";
      barra.classList.remove("urgente");

      lbl.textContent = "⏳ " + tiempo + " s";
      lbl.classList.remove("peligro");

      temporizador = setInterval(function() {
        tiempo--;

        lbl.textContent = "⏳ " + tiempo + " s";

        let porcentaje = (tiempo / tiempoLimite) * 100;

        barra.style.width = porcentaje + "%";

        if (porcentaje <= 60) {
          barra.style.background = "orange";
        }

        if (porcentaje <= 25) {
          barra.style.background = "red";
        }

        if (tiempo <= 5) {
          lbl.classList.add("peligro");
          barra.classList.add("urgente");
        }

        if (tiempo <= 0) {
          clearInterval(temporizador);

          if (!yaRespondio) {
            yaRespondio = true;

            const botones = document.querySelectorAll("#opciones button");

            botones.forEach(boton => {
              boton.disabled = true;

              if (Number(boton.textContent) == respuestaCorrecta) {
                boton.classList.add("correcta");
              }
            });

            document.getElementById("mensaje").textContent =
              "⏰ Tiempo agotado. La respuesta era " + respuestaCorrecta;

            if (preguntaActual < totalPreguntas) {
              document.getElementById("btnSiguiente").style.display = "inline-block";
            } else {
              document.getElementById("btnReiniciar").style.display = "inline-block";
              mostrarResultadoFinal();
            }
          }
        }
      }, 1000);
    }

    function iniciarJuego(){

    tablasSeleccionadas=[];

    if(document.getElementById("todas").checked){

        tablasSeleccionadas=[2,3,4,5,6,7,8,9];

    }else{

        document.querySelectorAll(".tabla:checked").forEach(c=>{

            tablasSeleccionadas.push(Number(c.value));

        });

    }

    if(tablasSeleccionadas.length==0){

        alert("Debes escoger al menos una tabla.");

        return;

    }

    document.getElementById("pantallaMenu").style.display="none";

    reiniciar();

}

   // nuevaPregunta();
  </script>

</body>
</html>
